[General]
DisplayServer=wayland
# SDDM 0.21 has no MinimumVT; it takes the first free VT. Keep the console
# getty on tty1 enabled, or disable it if the greeter cannot take the VT.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell XCURSOR_THEME=breeze_cursors XCURSOR_SIZE=24
InputMethod=

[Theme]
Current=elarun

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts
