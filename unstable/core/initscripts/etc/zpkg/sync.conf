# Default recipe repository for "zpkg sync".
#
# The tree is fetched with git and compared against the commit recorded in
# <recipes>/.zpkg-git. Set RECIPEGIT=0 to use a tarball/directory instead.
RECIPEURL=https://github.com/studio-nosa-tech/zignos-recipes
RECIPEGIT=1
RECIPEBRANCH=main
# The repository does not carry a recipes.manifest signature yet.
RECIPEALLOWUNSIGNED=1
