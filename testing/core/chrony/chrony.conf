# ZIGNOS chrony.conf — sync from public NTP pools; keep the RTC in sync too.
pool 2.pool.ntp.org iburst
driftfile /var/lib/chrony/chrony.drift
rtcsync
# Step the clock when the offset is large (first 3 updates): fresh VMs and
# installs can be minutes off, and waiting for gradual correction is worse.
makestep 1.0 3
